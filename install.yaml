name: generoi-worktree

ddev_version_constraint: '>= v1.24.0'

project_files:
  - config.generoi-worktree.yaml
  - generoi-worktree/lib.sh
  - generoi-worktree/Dockerfile.caddy
  - generoi-worktree/test-acceptance.sh
  - commands/host/wt-up
  - commands/host/wt-down
  - commands/host/wt-list
  - commands/host/wt-port
  - commands/host/wt-wp
  - commands/host/wt-guard

global_files: []

pre_install_actions: []

post_install_actions:
  - |
    #ddev-description: Make generoi-worktree commands executable
    chmod +x "$DDEV_APPROOT/.ddev/commands/host/wt-up" "$DDEV_APPROOT/.ddev/commands/host/wt-down" "$DDEV_APPROOT/.ddev/commands/host/wt-list" "$DDEV_APPROOT/.ddev/commands/host/wt-port" "$DDEV_APPROOT/.ddev/commands/host/wt-wp" "$DDEV_APPROOT/.ddev/commands/host/wt-guard"
  - |
    #ddev-description: Remind to gitignore generated worktree state
    if ! grep -qE '^\.ddev/wt/' "$DDEV_APPROOT/.gitignore" 2>/dev/null; then
      echo ""
      echo "generoi-worktree: add .ddev/wt/ to .gitignore (generated Caddyfile + state)."
    fi

removal_actions:
  - |
    #ddev-description: Stop any running worktree sidecar
    bash "$DDEV_APPROOT/.ddev/commands/host/wt-down" >/dev/null 2>&1 || true
